[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Compiler settings verified to reproduce the live DiveLogFactory bytecode
# byte-for-byte (Fuji 0x921dc74BA049748BdFeE471F641f48688aDF8b49, deployed via
# Avalanche Builders Hub): solc 0.8.34 + cancun + optimizer 200. Only the
# embedded source-metadata hash differs (multi-file vs flattened layout).
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = false
auto_detect_solc = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }, { access = "write", path = "./eip712-fixture.json" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
# interfaces/ are verbatim ERC-8260 reference assets — do not reformat them.
# When formatting locally, run:  forge fmt --skip "interfaces/*"
