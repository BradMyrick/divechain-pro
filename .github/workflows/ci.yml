name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # lib/ is gitignored (vendored locally); fetch the test dependency on CI
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit

      - name: Build
        run: forge build

      - name: Test
        run: forge test

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  indexer:
    name: Indexer (anvil self-verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry (provides anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: indexer

      - run: npm run verify:anvil
        working-directory: indexer
